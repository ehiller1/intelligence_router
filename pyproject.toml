[project]
name = "intelligence-router"
version = "0.1.0"
description = "Governed, tiered model routing for the AOM substrate (FR-IRG-* / FR-IR-*)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["ir_core"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ir_core"]
